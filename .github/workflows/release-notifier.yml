name: Release notifier
# Checkt PopsPortal op nieuwe releases en post ze in Discord

on:
  schedule:
    # Elke 15 minuten (bewust niet op :00, dan is GitHub het drukst)
    - cron: "7,22,37,52 * * * *"
  workflow_dispatch: {}   # handmatig starten via de Actions-tab

permissions:
  contents: write         # nodig om seen_products.json terug te schrijven

concurrency:
  group: release-notifier
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Check shop en post nieuwe releases
        run: python notify.py
        env:
          WC_URL: ${{ secrets.WC_URL }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          # Optioneel, onder Settings > Secrets and variables > Actions > Variables
          SHOP_ICON_URL: ${{ vars.SHOP_ICON_URL }}
          ACCOUNT_URL: ${{ vars.ACCOUNT_URL }}
          TIP_TEXT: ${{ vars.TIP_TEXT }}
          PREORDER_WORDS: ${{ vars.PREORDER_WORDS }}
          DISCORD_ROLE_ID: ${{ vars.DISCORD_ROLE_ID }}
          WC_CATEGORY_ID: ${{ vars.WC_CATEGORY_ID }}
          EMBED_COLOR: ${{ vars.EMBED_COLOR }}

      - name: Onthoud geposte producten
        if: always()
        run: |
          if [ -f seen_products.json ] && [ -n "$(git status --porcelain seen_products.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add seen_products.json
            git commit -m "Update geposte producten [skip ci]"
            git push
          fi
